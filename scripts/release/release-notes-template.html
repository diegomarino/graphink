<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Graphink Release Notes</title>
<!-- Generated at build time by scripts/release/notes.py from release tags (git-cliff) and release-notes/*.md. Published versions only; no timestamps. -->
<style>
:root {
  --bg: #f7f5f0; --surface: #ffffff; --text: #202932; --muted: #4d5966;
  --border: #d9d4c8; --accent: #1f6585;
  --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14191e; --surface: #212931; --text: #e9eef2; --muted: #a9b5c0; --border: #33404b; --accent: #7cc6e6; }
}
html { background: var(--bg); color: var(--text); }
body { font: 14px/1.5 var(--font); margin: 0 auto; max-width: 680px; padding: 24px 28px 40px; }
header { border-bottom: 1px solid var(--border); margin-bottom: 8px; padding-bottom: 12px; }
header h1 { color: var(--accent); font-size: 24px; font-weight: 600; margin: 0; }
header p { color: var(--muted); margin: 4px 0 0; }
section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin: 16px 0; padding: 4px 20px 12px; }
h2 { font-size: 17px; font-weight: 600; margin: 14px 0 4px; }
h2 .date { color: var(--muted); font-size: 13px; font-weight: 400; margin-left: 6px; }
h3 { color: var(--muted); font-size: 12px; letter-spacing: 0.06em; margin: 14px 0 2px; text-transform: uppercase; }
ul { margin: 4px 0; padding-left: 20px; }
li { margin: 3px 0; }
a { color: var(--accent); }
code { font-family: var(--mono); font-size: 0.9em; }
.empty { color: var(--muted); }
</style>
</head>
<body>
<header>
<h1>What's new in Graphink</h1>
<p>Release notes for each published version. Choose Help &gt; Release Notes to see them again.</p>
</header>
{{RELEASES}}
</body>
</html>
