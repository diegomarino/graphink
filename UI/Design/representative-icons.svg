<g id="icon-lock" data-label="Lock" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10V8a5 5 0 0 1 10 0v2"/><rect x="4" y="10" width="16" height="11" rx="2"/><circle fill="currentColor" cx="12" cy="15" r="1.5"/><path d="M12 16.5V18"/></g>
