name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; every push to main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint workflows and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned in .github/ci.env, the same binaries checks-fast.sh uses; they go first on PATH.
      - name: Install actionlint, shellcheck and ruff (checksum-verified release binaries)
        run: .github/scripts/install-lint-tools.sh "$RUNNER_TEMP/bin"
      # -shellcheck: lint run: blocks with the pinned shellcheck, not the image's.
      - name: actionlint
        run: actionlint -color -shellcheck "$SHELLCHECK" -pyflakes=
      - name: shellcheck CI and release scripts
        # SCRIPTDIR resolves the scripts' `. "$(dirname "$0")/common.sh"` sources.
        run: shellcheck -x -P SCRIPTDIR .github/scripts/*.sh scripts/release.sh

  fast:
    name: Fast checks (no Xcode)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # tags: the build version comes from them
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Install xmllint
        run: command -v xmllint || { sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends libxml2-utils; }
      - name: Install ruff, shellcheck and actionlint (checksum-verified release binaries)
        run: .github/scripts/install-lint-tools.sh "$RUNNER_TEMP/bin"
      - run: .github/scripts/checks-fast.sh "$RUNNER_TEMP/logs/fast"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fast-check-logs
          path: ${{ runner.temp }}/logs
          retention-days: 7

  notes:
    name: Release notes preview (git-cliff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # git-cliff needs the tags and every commit since the last release
      - name: Load CI settings
        run: grep -Ev '^[[:space:]]*(#|$)' .github/ci.env >> "$GITHUB_ENV"
      - name: Install git-cliff (checksum-verified release binary)
        run: .github/scripts/install-git-cliff.sh "$RUNNER_TEMP/bin"
      # feat/fix/perf commits since the last vYYYY.M.n tag, grouped as Added/Fixed/Improved (cliff.toml).
      - name: Unreleased notes to the job summary
        run: |
          set -euo pipefail
          notes=$(git-cliff --config cliff.toml --unreleased)
          {
            echo "## Unreleased release notes (git-cliff preview)"
            echo
            if [ -n "$notes" ]; then echo "$notes"; else echo "No feat, fix or perf commits since the last release."; fi
          } >> "$GITHUB_STEP_SUMMARY"

  macos:
    name: macOS ${{ matrix.configuration }}
    needs: fast
    # Single runner switch: repository variable MACOS_RUNNER (a hosted label).
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      # Window-creating checks are opt-in (repository variable GUI_CHECKS=1).
      GUI_CHECKS: ${{ vars.GUI_CHECKS || '0' }}
      CONFIGURATION: ${{ matrix.configuration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # tags: MARKETING_VERSION and the bundled release notes come from them
      - name: Load CI settings
        run: grep -Ev '^[[:space:]]*(#|$)' .github/ci.env >> "$GITHUB_ENV"
      # The build injects MARKETING_VERSION from tags and bundles the published versions' notes.
      - name: Install git-cliff (in-app release notes)
        run: .github/scripts/install-git-cliff.sh "$RUNNER_TEMP/bin"
      - name: Bootstrap pinned OmniGroup and reviewed patches
        run: .github/scripts/bootstrap-omnigroup.sh
      - name: Toolchain checks (no products, no windows)
        if: matrix.configuration == 'Debug'
        run: .github/scripts/checks-toolchain.sh "$RUNNER_TEMP/logs/toolchain"
      # Pushes to main build Release the way release.yml does, so the DMG below is installable.
      - name: Build ${{ matrix.configuration }}
        run: |
          if [ "$CONFIGURATION" = Release ] && [ "$GITHUB_EVENT_NAME" = push ] && [ "$SIGNING_MODE" = adhoc ]; then
            export EXTRA_BUILD_SETTINGS="$RELEASE_DISTRIBUTION_SETTINGS"
          fi
          .github/scripts/build.sh "$CONFIGURATION" "$RUNNER_TEMP/build"
      - name: Windowless product checks
        if: matrix.configuration == 'Debug'
        run: .github/scripts/checks-products.sh "$RUNNER_TEMP/build" "$RUNNER_TEMP/logs/products"
      # Every merge to main: Graphink.dmg as a short-lived workflow artifact only.
      # Never a tag or a GitHub Release (that is release.yml). PR builds upload logs only.
      - name: Package Graphink.dmg (main only)
        if: matrix.configuration == 'Release' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: .github/scripts/package-release.sh "$RUNNER_TEMP/build" "$RUNNER_TEMP/dist" "$(.github/scripts/version.sh show)"
      - if: matrix.configuration == 'Release' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Graphink-dmg-${{ github.sha }}
          path: ${{ runner.temp }}/dist
          retention-days: 5
          if-no-files-found: error
      # Logs only: build products are never uploaded from PR builds (Debug carries
      # a development entitlement and must not be distributed).
      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          if [ -f "$RUNNER_TEMP/build/$CONFIGURATION/build.log" ]; then
            cp "$RUNNER_TEMP/build/$CONFIGURATION/build.log" "$RUNNER_TEMP/logs/"
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.configuration }}-logs
          path: ${{ runner.temp }}/logs
          retention-days: 14
          if-no-files-found: ignore
